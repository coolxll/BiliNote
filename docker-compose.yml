
services:
  backend:
    container_name: bilinote-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # 国内拉不到 docker.io 时设置 BASE_REGISTRY=docker.m.daocloud.io（或其他可用镜像）
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io}
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX: ${PIP_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    env_file:
      - ${BILINOTE_ENV_FILE:-.env}
    environment:
      - BACKEND_PORT=${BACKEND_PORT}
      - BACKEND_HOST=${BACKEND_HOST}
      - QWEN_AUDIOREAD_BASE_URL=http://qwen-audioread-api:8000
    volumes:
      # 把整个 backend/ 目录绑到 /app，意味着这些都持久化到宿主机、删容器不丢：
      #   ./backend/bili_note.db                — SQLite 数据库（含 LLM 供应商配置、笔记历史）
      #   ./backend/config/transcriber.json     — 转写器运行时配置
      #   ./backend/static/screenshots/         — 视频截图
      #   ./backend/uploads/                    — 上传的本地视频
      - ./backend:/app
    expose:
      - "${BACKEND_PORT}"  # 不再对外暴露，用于 nginx 内部通信
    # 用 unless-stopped 而非 on-failure:N，避免任何短暂崩溃把容器永久打死后
    # 再也接收不到用户修过的 .env。手动 docker-compose stop 仍可正常停下。
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT}/api/sys_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # WHISPER_MODEL_SIZE 选 medium 及以上请把这里调到 8g+，
    # 否则首次模型加载时容易被 host OOM-killer 干掉。
    mem_limit: ${BACKEND_MEMORY_LIMIT:-4g}
    depends_on:
      qwen-audioread-api:
        condition: service_healthy

  frontend:
    container_name: bilinote-frontend
    build:
      context: .
      dockerfile: BillNote_frontend/Dockerfile
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io}
    env_file:
      - ${BILINOTE_ENV_FILE:-.env}
    expose:
      - "80"  # 不暴露给宿主机，只供 nginx 访问
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-512m}

  nginx:
    container_name: bilinote-nginx
    image: nginx:1.25-alpine
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    mem_limit: ${NGINX_MEMORY_LIMIT:-256m}

  qwen-audioread-api:
    container_name: qwen-audioread-api
    image: ${QWEN_AUDIOREAD_IMAGE:-ghcr.io/coolxll/qwen-audioread-api:main}
    environment:
      QWEN2API_DATA_DIR: /app/data
      QWEN2API_API_KEY: ${QWEN_AUDIOREAD_API_KEY}
      QWEN2API_RUNTIME: http
      QWEN2API_DEFAULT_FORMAT: md
      QWEN2API_DELETE_REMOTE: "true"
      QWEN2API_EXPORT_CONCURRENCY: "1"
      QWEN2API_KEEP_JOB_TEXT: "false"
      QWEN2API_KEEP_UPLOADED_INPUT: "false"
      QWEN2API_KEEP_INTERMEDIATE_OUTPUTS: "false"
      QWEN2API_JOB_WORKERS: "1"
      QWEN2API_MAX_RETRIES: "2"
      QWEN2API_RETRY_DELAY_SECONDS: "30"
      QWEN2API_QWEN_ROOT: /app
      QWEN2API_QWEN_AUTH_STATE: /app/.auth/qwen-audioread-auth.json
      QWEN_HTTP_COOKIE_MODE: ticket-only
      QWEN_OSS_UPLOAD_MODE: multipart
    ports:
      - "127.0.0.1:${QWEN_AUDIOREAD_HOST_PORT:-11308}:8000"
    volumes:
      - ./deploy/audioread/data:/app/data
      - ./deploy/audioread/.auth:/app/.auth:ro
    init: true
    restart: unless-stopped
    cpus: ${QWEN_AUDIOREAD_CPU_LIMIT:-1.0}
    mem_limit: ${QWEN_AUDIOREAD_MEMORY_LIMIT:-512m}
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
